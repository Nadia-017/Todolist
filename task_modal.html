<!-- Modal สำหรับบันทึก/แก้ไขงาน -->
<div id="taskModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-md hidden transition-opacity duration-300">
    
    <!-- โครงสร้างหลัก Modal -->
    <div class="bg-white rounded-3xl shadow-2xl w-full max-w-2xl overflow-hidden flex flex-col max-h-[90vh] transform transition-all modal-animate">
        
        <!-- หัวข้อ Modal (Header) -->
        <div class="bg-gradient-to-r from-emerald-800 to-teal-800 text-white p-4 sm:p-5 flex items-center justify-between shrink-0">
            <h3 id="modalTitle" class="font-bold text-base sm:text-lg flex items-center gap-2">
                <i class="fas fa-plus-circle text-emerald-300"></i> บันทึกงานใหม่
            </h3>
            <button type="button" onclick="closeTaskModal()" class="text-slate-300 hover:text-white p-2 rounded-xl hover:bg-white/10 transition-colors">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <!-- ฟอร์มกรอกข้อมูล (ครอบคลุมเนื้อหาทั้งหมดเพื่อให้ปุ่ม Submit ทำงานถูกต้อง) -->
        <form id="taskForm" onsubmit="submitTaskForm(event)" class="flex flex-col flex-1 overflow-hidden">
            <input type="hidden" id="formRowId">

            <!-- ส่วนเนื้อหาที่สามารถเลื่อนได้ (Scrollable Body) -->
            <div class="p-4 sm:p-6 overflow-y-auto space-y-4 flex-1">
                
                <!-- วันที่ & ผู้บันทึก -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">วันที่ปฏิบัติงาน</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i class="far fa-calendar-alt text-xs"></i>
                            </span>
                            <input type="text" id="taskDate" required
                                class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl pl-9 pr-3.5 py-2.5 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">ผู้บันทึก</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                                <i class="far fa-user text-xs"></i>
                            </span>
                            <select id="taskRecorder" required
                                class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl pl-9 pr-8 py-2.5 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all appearance-none">
                                <option value="">-- เลือกผู้บันทึก --</option>
                            </select>
                            <span class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-400">
                                <i class="fas fa-chevron-down text-xs"></i>
                            </span>
                        </div>
                    </div>
                </div>

                <!-- เลือกแผนก -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">เลือกแผนก (ทางเลือก)</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                            <i class="far fa-building text-xs"></i>
                        </span>
                        <select id="departmentSelect" onchange="loadDepartmentTasks(this.value)"
                            class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl pl-9 pr-8 py-2.5 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all appearance-none">
                            <option value="">-- เลือกแผนกงาน --</option>
                            <option value="finance">การเงิน</option>
                            <option value="loan">สินเชื่อ</option>
                            <option value="debt_collection">ติดตามหนี้สิน</option>
                            <option value="accounting">บัญชี</option>
                            <option value="it">ไอที</option>
                            <option value="administrative">ธุรการ</option>
                            <option value="hr">ทรัพยากรบุคคล</option>
                            <option value="community">ชุมชน</option>
                        </select>
                        <span class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-400">
                            <i class="fas fa-chevron-down text-xs"></i>
                        </span>
                    </div>
                </div>

                <!-- รายการงานตามแผนก -->
                <div id="deptTaskWrapper" class="hidden space-y-3 bg-slate-50/70 p-4 rounded-2xl border border-slate-200/80">
                    <div class="flex items-center justify-between">
                        <label class="block text-xs font-semibold text-slate-700 flex items-center gap-1.5">
                            <i class="fas fa-tasks text-emerald-600"></i> รายละเอียดงานตามแผนก
                        </label>
                    </div>
                    <div id="deptTaskItemsContainer" class="space-y-2"></div>
                    <button type="button" onclick="addDeptTaskRow()" class="w-full py-2 border border-dashed border-emerald-300 hover:border-emerald-500 bg-emerald-50/50 hover:bg-emerald-50 text-emerald-700 rounded-xl text-xs font-semibold flex items-center justify-center gap-1.5 transition-all">
                        <i class="fas fa-plus"></i> เพิ่มรายการงาน
                    </button>
                </div>

                <!-- หมายเหตุ -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">หมายเหตุ</label>
                    <textarea id="taskNote" rows="2" placeholder="ระบุหมายเหตุเพิ่มเติม (ถ้ามี)..."
                        class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-sm rounded-xl p-3 focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition-all resize-none"></textarea>
                </div>

                <!-- สรุปผลรวมใน Modal -->
                <div class="bg-gradient-to-r from-emerald-50 to-teal-50 border border-emerald-100 p-3.5 rounded-2xl flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2 text-xs sm:text-sm text-emerald-900 font-medium">
                    <div class="flex items-center gap-1.5">
                        <i class="fas fa-calculator text-emerald-600"></i>
                        <span>รวมทั้งหมด: <strong id="modalTotalItems" class="text-emerald-950">0</strong> รายการ (<strong id="modalTotalQty" class="text-emerald-950">0</strong> หน่วย)</span>
                    </div>
                    <div class="flex items-center gap-1.5 bg-white/80 px-3 py-1.5 rounded-xl border border-emerald-200/60 shadow-sm">
                        <span>คะแนนรวม:</span>
                        <strong id="modalTotalScore" class="text-emerald-700 text-base font-bold">0</strong>
                        <span class="text-xs font-normal text-emerald-600">คะแนน</span>
                    </div>
                </div>

            </div>

            <!-- ปุ่มกดบันทึก (Footer) -->
            <div class="p-4 sm:p-5 bg-slate-50 border-t border-slate-100 flex items-center gap-3 shrink-0">
                <button type="button" onclick="closeTaskModal()" class="flex-1 bg-white hover:bg-slate-100 border border-slate-200 text-slate-600 font-semibold py-2.5 rounded-xl text-sm transition-all shadow-sm">
                    ยกเลิก
                </button>
                <button type="submit" id="submitBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl text-sm transition-all shadow-lg shadow-emerald-600/25 flex items-center justify-center gap-2">
                    <i class="fas fa-save"></i>
                    <span>บันทึกข้อมูลทั้งหมด</span>
                </button>
            </div>

        </form>
    </div>
</div>

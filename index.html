<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/jpeg" href="image/contract.png">
    <title>ระบบบันทึกงานและคะแนนปฏิบัติงาน</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font - Prompt -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Flatpickr CSS & JS (พร้อม ภาษาไทย) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/th.js"></script>
    <!-- Flatpickr Month Select Plugin -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/plugins/monthSelect/style.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/plugins/monthSelect/index.js"></script>

    <style>
        body {
            font-family: 'Prompt', sans-serif;
            background-color: #f0fdf4;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #a7f3d0;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #34d399;
        }

        .modal-animate {
            animation: modalFadeIn 0.25s ease-out forwards;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body class="text-slate-700 min-h-screen flex flex-col selection:bg-emerald-500 selection:text-white">

    <header
        class="bg-gradient-to-r from-emerald-800 via-emerald-700 to-teal-800 text-white shadow-lg sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between space-y-3 md:space-y-0">
                <div class="flex items-center space-x-3">
                    <div
                        class="w-10 h-10 bg-white/20 backdrop-blur-md rounded-xl flex items-center justify-center text-white text-xl shadow-inner border border-white/30">
                        <i class="fas fa-tasks"></i>
                    </div>
                    <div>
                        <h1 class="text-xl sm:text-2xl font-bold tracking-tight">ระบบบันทึกงานและคะแนนปฏิบัติงาน</h1>
                    </div>
                </div>

                <div class="flex items-center space-x-3 self-end md:self-auto">
                    <span id="currentUserDisplay"
                        class="text-xs sm:text-sm font-medium text-emerald-100 bg-white/10 px-3 py-1.5 rounded-xl border border-white/20"></span>
                    <button onclick="handleLogout()" title="ออกจากระบบ"
                        class="text-xs sm:text-sm px-3 py-2 bg-rose-500/80 hover:bg-rose-600 text-white rounded-xl text-xs font-medium transition-colors">
                        <i class="fas fa-sign-out-alt"></i>
                        <span> ออกจากระบบ</span>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between border-b border-emerald-600/40 mt-4 pt-1 gap-2">
                <div class="flex space-x-2 overflow-x-auto flex-1 pb-1 sm:pb-0">
                    <button id="tabTasksBtn" type="button" onclick="switchMainTab('tasks')"
                        class="px-5 py-2.5 text-xs sm:text-sm font-semibold rounded-t-xl bg-white text-emerald-800 flex items-center space-x-2 transition-all shadow-sm whitespace-nowrap">
                        <i class="fas fa-list-check"></i>
                        <span>รายการงานทั้งหมด</span>
                    </button>

                    <button id="tabSummaryBtn" type="button" onclick="switchMainTab('summary')"
                        class="px-5 py-2.5 text-xs sm:text-sm font-semibold rounded-t-xl bg-emerald-900/40 text-emerald-100 flex items-center space-x-2 transition-all whitespace-nowrap">
                        <i class="fas fa-chart-pie"></i>
                        <span>สรุปการทำงานรายเดือน</span>
                    </button>
                </div>
            </div>
        </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <div id="loadingOverlay" class="flex flex-col items-center justify-center py-16 text-emerald-700 space-y-3">
            <i class="fas fa-circle-notch fa-spin text-4xl"></i>
            <p class="text-sm font-medium animate-pulse">กำลังโหลดข้อมูลจากระบบ...</p>
        </div>
        <div id="taskListContainer"></div>
        <div id="summaryContainer" class="hidden"></div>
        <div id="modalContainer"></div>

    </main>


    <!-- Toast Notification -->
    <div id="toast"
        class="fixed bottom-5 right-5 z-50 transform translate-y-20 opacity-0 transition-all duration-300 max-w-sm bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center space-x-3 border border-slate-700">
        <i id="toastIcon" class="fas fa-info-circle text-emerald-400 text-lg"></i>
        <p id="toastMessage" class="text-xs sm:text-sm font-medium">ข้อความแจ้งเตือน</p>
    </div>

    <script>

        (async function checkLoginStatus() {
            try {
                const response = await fetch('db.php?action=get_data');
                const res = await response.json();

                if (res.auth_required) {
                    window.location.href = 'login.html';
                }
            } catch (err) {
                window.location.href = 'login.html';
            }
        })();

        let globalTasks = [];
        let globalEmployees = [];
        let globalJobTypes = [];
        let currentUser = null;
        //  let currentViewMode = 'table';
        let currentTab = 'tasks';
        let rowCounter = 0;
        let summaryMonthPickerInstance = null;
        let datePickerInstance = null;


        window.onload = async function () {
            await loadHtmlComponents();

            //  ตั้งค่าวันที่ปัจจุบัน
            const todayStr = new Date().toISOString().substring(0, 10);
            const taskDateEl = document.getElementById('taskDate');
            if (taskDateEl) taskDateEl.value = todayStr;

            //  ดึงข้อมูลจาก Backend 
            await loadDataFromBackend();
        };

        async function loadHtmlComponents() {
            try {
                const [taskListRes, summaryRes, modalRes] = await Promise.all([
                    fetch('task_list.html'),
                    fetch('summary_view.html'),
                    fetch('task_modal.html')
                ]);

                const taskListHtml = await taskListRes.text();
                const summaryHtml = await summaryRes.text();
                const modalHtml = await modalRes.text();

                const taskListEl = document.getElementById('taskListContainer');
                const summaryEl = document.getElementById('summaryContainer');
                const modalEl = document.getElementById('modalContainer');

                if (taskListEl) taskListEl.innerHTML = taskListHtml;
                if (summaryEl) summaryEl.innerHTML = summaryHtml;
                if (modalEl) modalEl.innerHTML = modalHtml;

                initSummaryMonthPicker();

            } catch (err) {
                console.error('ไม่สามารถโหลด Component ได้:', err);
            }
        }

        async function loadDataFromBackend() {
            try {
                const loadingEl = document.getElementById('loadingOverlay');
                if (loadingEl) loadingEl.classList.remove('hidden');

                const response = await fetch('db.php?action=get_data');
                const res = await response.json();

                if (res.auth_required) {
                    window.location.href = 'login.html';
                    return;
                }

                if (res && res.success) {
                    currentUser = res.currentUser;
                    globalTasks = res.rows || [];
                    globalEmployees = res.employees || [];
                    globalJobTypes = res.jobTypes || [];

                    const userDisplay = document.getElementById('currentUserDisplay');
                    if (userDisplay && currentUser) {
                        userDisplay.innerHTML = `<i class="fas fa-user-circle mr-1"></i> ${currentUser.name}`;
                    }

                    populateEmployeeDropdowns();
                    populateJobTypeDropdowns();
                    filterAndRenderTasks();
                    renderMonthlySummary();

                    if (loadingEl) loadingEl.classList.add('hidden');

                    const tabTasksEl = document.getElementById('tabTasks');
                    if (tabTasksEl) tabTasksEl.classList.remove('hidden');
                }
            } catch (err) {
                showToast('ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้', 'error');
            }
            initSummaryMonthPicker();
            renderMonthlySummary();
        }

        async function handleLogout() {
            try {
                await fetch('db.php?action=logout');
                window.location.href = 'login.html';
            } catch (err) {
                window.location.href = 'login.html';
            }
        }

        function formatDateToDMY(dateStr) {
            if (!dateStr) return '-';
            const parts = dateStr.includes('-') ? dateStr.split('-') : dateStr.split('/');
            if (parts.length === 3) {
                if (parts[0].length === 4) {
                    return `${parts[2]}/${parts[1]}/${parts[0]}`;
                } else {
                    return `${parts[0]}/${parts[1]}/${parts[2]}`;
                }
            }
            return dateStr;
        }


        function renderTableRows(tasks) {
            const tbody = document.getElementById('taskTableBody');

            if (!tbody) return;

            if (tasks.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-10 text-slate-400 font-light">ไม่พบข้อมูลภาระงานที่ตรงตามเงื่อนไข</td></tr>`;
                return;
            }

            tbody.innerHTML = tasks.map(t => `
        <tr class="hover:bg-slate-50/80 transition-colors">
<td class="px-4 py-3.5 text-slate-600 font-medium whitespace-nowrap">${formatDateToDMY(t.date)}</td>
          <td class="px-4 py-3.5 text-slate-800 font-semibold">${t.recorder || '-'}</td>
            <td class="px-4 py-3.5 text-slate-700">
                <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-100/80 text-emerald-800">
                    ${t.jobType || '-'}
                </span>
            </td>
            <td class="px-4 py-3.5 text-center text-slate-700 font-medium">${t.quantity || 0}</td>
            <td class="px-4 py-3.5 text-center font-bold text-emerald-600">${t.score ? Number(t.score).toLocaleString('th-TH') : 0}</td>
            <td class="px-4 py-3.5 text-slate-500 max-w-xs truncate">${t.note || '-'}</td>
            <td class="px-4 py-3.5 text-center">
                <button onclick="editTask(${t.id})" class="text-slate-400 hover:text-emerald-600 p-1.5 transition-colors rounded-lg hover:bg-emerald-50" title="แก้ไข">
                    <i class="fas fa-edit"></i>
                </button>
            </td>
        </tr>
    `).join('');
        }

        function renderCardItems(tasks) {
            const container = document.getElementById('cardViewContainer');
            if (!container) return;

            if (tasks.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-10 text-slate-400 font-light">ไม่พบข้อมูลภาระงานที่ตรงตามเงื่อนไข</div>`;
                return;
            }

            container.innerHTML = tasks.map(t => `
        <div class="bg-white p-4 rounded-2xl border border-emerald-100 shadow-sm space-y-3 hover:shadow-md transition-all">
            <div class="flex items-center justify-between">
                <span class="text-xs font-semibold text-emerald-800 bg-emerald-50 px-2.5 py-1 rounded-lg">
<i class="far fa-calendar-alt mr-1.5"></i>${formatDateToDMY(t.date)}
                </span>
                <button onclick="editTask(${t.id})" class="text-slate-400 hover:text-emerald-600 p-1 rounded-lg hover:bg-slate-50" title="แก้ไข">
                    <i class="fas fa-edit"></i>
                </button>
            </div>
            <div>
                <h4 class="font-bold text-slate-800 text-sm flex items-center">
                    <i class="fas fa-user-circle text-emerald-600 mr-1.5"></i>${t.recorder || 'ไม่ระบุผู้บันทึก'}
                </h4>
                <p class="text-xs text-slate-600 mt-1"><strong class="text-slate-700">ประเภทงาน:</strong> ${t.jobType || '-'}</p>
            </div>
            <div class="flex items-center justify-between pt-2 border-t border-slate-100 text-xs">
                <span class="text-slate-500">จำนวน: <strong class="text-slate-800">${t.quantity || 0}</strong> หน่วย</span>
                <span class="text-emerald-700 font-bold bg-emerald-100/60 px-2.5 py-1 rounded-lg">${t.score ? Number(t.score).toLocaleString('th-TH') : 0} คะแนน</span>
            </div>
        </div>
    `).join('');
        }

        function filterAndRenderTasks() {
            const filterDate = document.getElementById('filterDate')?.value || '';
            const filterEmp = document.getElementById('filterEmployee')?.value || 'ALL';
            const filterJob = document.getElementById('filterJobType')?.value || 'ALL';
            const search = document.getElementById('searchInput')?.value.toLowerCase().trim() || '';

            const filtered = globalTasks.filter(t => {
                const matchDate = !filterDate || t.date === filterDate;
                const matchEmp = filterEmp === 'ALL' || t.recorder === filterEmp;
                const matchJob = filterJob === 'ALL' || (t.jobType && t.jobType.includes(filterJob));
                const matchSearch = !search ||
                    (t.note && t.note.toLowerCase().includes(search)) ||
                    (t.recorder && t.recorder.toLowerCase().includes(search)) ||
                    (t.jobType && t.jobType.toLowerCase().includes(search));

                return matchDate && matchEmp && matchJob && matchSearch;
            });

            renderTableRows(filtered);
            renderCardItems(filtered);
        }

        // อัปเดตฟังก์ชัน switchMainTab
        function switchMainTab(tab) {
            currentTab = tab;
            const taskListContainer = document.getElementById('taskListContainer');
            const summaryContainer = document.getElementById('summaryContainer');
            const tabTasksBtn = document.getElementById('tabTasksBtn');
            const tabSummaryBtn = document.getElementById('tabSummaryBtn');

            if (tab === 'tasks') {
                if (taskListContainer) taskListContainer.classList.remove('hidden');
                if (summaryContainer) summaryContainer.classList.add('hidden');

                tabTasksBtn?.classList.add('bg-white', 'text-emerald-800', 'shadow-sm');
                tabTasksBtn?.classList.remove('bg-emerald-900/40', 'text-emerald-100');
                tabSummaryBtn?.classList.remove('bg-white', 'text-emerald-800', 'shadow-sm');
                tabSummaryBtn?.classList.add('bg-emerald-900/40', 'text-emerald-100');
            } else {
                if (taskListContainer) taskListContainer.classList.add('hidden');
                if (summaryContainer) summaryContainer.classList.remove('hidden');

                tabSummaryBtn?.classList.add('bg-white', 'text-emerald-800', 'shadow-sm');
                tabSummaryBtn?.classList.remove('bg-emerald-900/40', 'text-emerald-100');
                tabTasksBtn?.classList.remove('bg-white', 'text-emerald-800', 'shadow-sm');
                tabTasksBtn?.classList.add('bg-emerald-900/40', 'text-emerald-100');

                renderMonthlySummary();
            }
        }

        function populateEmployeeDropdowns() {
            const filterEmp = document.getElementById('filterEmployee');
            const summaryEmp = document.getElementById('summaryFilterEmployee');
            const taskRecorderSelect = document.getElementById('taskRecorder');
            const filterEmpCard = document.getElementById('filterEmployeeCard');
            const filterGridContainer = document.getElementById('filterGridContainer');
            const summaryEmpCard = document.getElementById('summaryEmployeeFilterCard');
            const summaryGridContainer = document.getElementById('summaryGridContainer');

            let optionsHtml = '<option value="ALL">-- แสดงทั้งหมด --</option>';
            let recorderOptionsHtml = '<option value="">-- เลือกผู้บันทึก --</option>';

            globalEmployees.forEach(emp => {
                const cleanName = emp.trim();
                if (cleanName) {
                    optionsHtml += `<option value="${cleanName}">${cleanName}</option>`;
                    recorderOptionsHtml += `<option value="${cleanName}">${cleanName}</option>`;
                }
            });

            if (filterEmp) filterEmp.innerHTML = optionsHtml;
            if (summaryEmp) summaryEmp.innerHTML = optionsHtml.replace('-- แสดงทั้งหมด --', '-- แสดงพนักงานทุกคน --');
            if (taskRecorderSelect) {
                taskRecorderSelect.innerHTML = recorderOptionsHtml;
                if (currentUser && currentUser.name) {
                    taskRecorderSelect.value = currentUser.name;
                }
            }

            // จัดการการแสดงผลตามสิทธิ์การใช้งาน
            if (currentUser && currentUser.role === 'admin') {
                // Admin
                if (filterEmpCard) filterEmpCard.classList.remove('hidden');
                if (filterGridContainer) {
                    filterGridContainer.classList.remove('lg:grid-cols-3');
                    filterGridContainer.classList.add('lg:grid-cols-4');
                }

                if (summaryEmpCard) summaryEmpCard.classList.remove('hidden');
                if (summaryGridContainer) {
                    summaryGridContainer.classList.remove('lg:grid-cols-4');
                    summaryGridContainer.classList.add('lg:grid-cols-5');
                }
            } else {
                // User ทั่วไป
                if (filterEmpCard) filterEmpCard.classList.add('hidden');
                if (filterGridContainer) {
                    filterGridContainer.classList.remove('lg:grid-cols-4');
                    filterGridContainer.classList.add('lg:grid-cols-3');
                }

                if (summaryEmpCard) summaryEmpCard.classList.add('hidden');
                if (summaryGridContainer) {
                    summaryGridContainer.classList.remove('lg:grid-cols-5');
                    summaryGridContainer.classList.add('lg:grid-cols-4');
                }
            }
        }

        function populateJobTypeDropdowns() {
            const filterJob = document.getElementById('filterJobType');
            let optionsHtml = '<option value="ALL">-- ทุกประเภทงาน --</option>';

            globalJobTypes.forEach(j => {
                optionsHtml += `<option value="${j.type}">${j.type} (${j.score} คะแนน)</option>`;
            });

            if (filterJob) filterJob.innerHTML = optionsHtml;
        }


        function initDatePicker() {
            const inputEl = document.getElementById('taskDate');
            if (!inputEl) return null;

            if (datePickerInstance) return datePickerInstance;

            if (typeof flatpickr !== 'undefined') {
                datePickerInstance = flatpickr(inputEl, {
                    locale: "th",
                    dateFormat: "Y-m-d",
                    altInput: true,
                    altFormat: "d/m/Y",
                    allowInput: true,
                    disableMobile: "true"
                });
            }
            return datePickerInstance;
        }


        function initSummaryMonthPicker() {
            const inputEl = document.getElementById('summaryFilterMonth');
            if (!inputEl || summaryMonthPickerInstance) return;

            if (typeof flatpickr !== 'undefined' && typeof monthSelectPlugin !== 'undefined') {
                summaryMonthPickerInstance = flatpickr(inputEl, {
                    locale: "th",
                    dateFormat: "Y-m",
                    altInput: true,
                    altFormat: "F Y",
                    disableMobile: "true",
                    plugins: [
                        new monthSelectPlugin({
                            shorthand: true,
                            dateFormat: "Y-m",
                            altFormat: "F Y"
                        })
                    ],
                    onChange: function (selectedDates, dateStr) {
                        renderMonthlySummary();
                    }
                });
            }
        }

        // ฟังก์ชันสำหรับสลับหน้าฟอร์มแผนก
        function toggleDepartmentForm() {
            const selectedDept = document.getElementById('departmentSelect').value;
            const allForms = document.querySelectorAll('.dept-form');

            allForms.forEach(form => form.classList.add('hidden'));

            if (selectedDept) {
                const activeForm = document.getElementById(`form-${selectedDept}`);
                if (activeForm) {
                    activeForm.classList.remove('hidden');
                    const container = document.getElementById(`container-${selectedDept}`);
                    if (container && container.children.length === 0) {
                        addDeptTaskRow(selectedDept);
                    }
                }
            }
        }

        // ฟังก์ชันเพิ่มรายการย่อยในแผนก
        function addDeptTaskRow(deptKey) {
            const container = document.getElementById(`container-${deptKey}`);
            if (!container) return;

            const rowId = `dept-row-${Date.now()}`;

            // กำหนด Placeholder ให้ตรงตามแผนก
            const placeholders = {
                finance: 'ระบุรายการรับ-จ่าย/จำนวนเงิน',
                loan: 'ระบุเลขที่สัญญา/รายละเอียดสินเชื่อ',
                debt_collection: 'ระบุรายละเอียดการติดตามหนี้',
                accounting: 'ระบุหมวดหมู่บัญชี/เลขที่ใบเสร็จ',
                it: 'ระบุระบบ/อุปกรณ์ที่ดำเนินการแก้ไข',
                administrative: 'ระบุรายละเอียดงานสารบรรณ/พัสดุ',
                hr: 'ระบุเรื่องที่ดำเนินการ (ลา/สวัสดิการ/OT)',
                community: 'ระบุชื่อชุมชน/โครงการ'
            };

            const placeholderText = placeholders[deptKey] || 'ระบุรายละเอียด';

            const rowHTML = `
        <div id="${rowId}" class="flex items-center space-x-2">
            <input type="text" name="dept_detail_${deptKey}[]" required placeholder="${placeholderText}"
                class="flex-1 bg-white border border-slate-200 rounded-xl p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            <button type="button" onclick="removeDeptTaskRow('${rowId}')"
                class="w-9 h-9 rounded-xl bg-rose-50 text-rose-600 hover:bg-rose-100 hover:text-rose-700 flex items-center justify-center transition-colors flex-shrink-0">
                <i class="fas fa-trash-alt text-xs"></i>
            </button>
        </div>
    `;
            container.insertAdjacentHTML('beforeend', rowHTML);
        }


        function handleDepartmentChange(deptValue) {
            // ซ่อนฟอร์มแผนกทั้งหมดก่อน
            document.querySelectorAll('.dept-form').forEach(el => {
                el.classList.add('hidden');
            });

            // แสดงฟอร์มแผนกที่เลือก
            if (deptValue) {
                const targetForm = document.getElementById(`dept-${deptValue}`);
                if (targetForm) {
                    targetForm.classList.remove('hidden');
                }
            }
        }

        // ฟังก์ชันลบรายการย่อย
        function removeDeptTaskRow(rowId) {
            const row = document.getElementById(rowId);
            if (row) {
                row.remove();
            }
        }

        let currentDeptTasks = [];

        //  ดึงรายการงานตามแผนก
        async function loadDepartmentTasks(deptKey) {
            const wrapper = document.getElementById('deptTaskWrapper');
            const container = document.getElementById('deptTaskItemsContainer');

            if (!wrapper || !container) return;

            if (!deptKey) {
                wrapper.classList.add('hidden');
                container.innerHTML = '';
                currentDeptTasks = [];
                return;
            }
            try {
                const res = await fetch(`db.php?action=get_dept_tasks&dept=${deptKey}`);
                const result = await res.json();

                if (result.success) {
                    currentDeptTasks = result.data;
                    wrapper.classList.remove('hidden');
                    container.innerHTML = '';
                    addDeptTaskRow(); // เพิ่มแถวแรกให้อัตโนมัติ
                } else {
                    throw new Error(result.error || 'ดึงข้อมูลไม่สำเร็จ');
                }
            } catch (err) {

        // ==================== ช่องค้นหาสำหรับ "รายละเอียดงานตามแผนก" (ต่อแถว) ====================
        function initDeptTaskCombobox(rowEl) {
            const select = rowEl.querySelector('.dept-task-select');
            const input = rowEl.querySelector('.dept-task-search');
            const list = rowEl.querySelector('.dept-task-options');
            if (!select || !input || !list) return;

            let activeIndex = -1;

            const getOptions = () => currentDeptTasks.map(t => ({
                value: t.task_name,
                label: t.task_name,
                score: t.score || 0
            }));

            const filterOptions = (query) => {
                const q = (query || '').trim().toLowerCase();
                const opts = getOptions();
                if (!q) return opts;
                return opts.filter(o => o.label.toLowerCase().includes(q));
            };

            const render = (options) => {
                activeIndex = -1;
                if (!options.length) {
                    list.innerHTML = `<div class="p-3 text-sm text-slate-400 text-center">ไม่พบรายการที่ตรงกับคำค้นหา</div>`;
                    return;
                }
                list.innerHTML = options.map(o => `
                    <div data-value="${o.value}"
                        class="px-3.5 py-2 text-sm text-slate-700 hover:bg-emerald-50 hover:text-emerald-800 cursor-pointer transition-colors">
                        ${o.label}${o.score ? ` <span class="text-xs text-slate-400">(${o.score} คะแนน)</span>` : ''}
                    </div>
                `).join('');
                list.querySelectorAll('[data-value]').forEach(el => {
                    el.addEventListener('mousedown', (e) => {
                        // ใช้ mousedown + preventDefault กันไม่ให้ input เสีย focus ก่อนรับค่าคลิก
                        e.preventDefault();
                        chooseValue(el.dataset.value);
                    });
                });
            };

            const highlight = () => {
                const items = Array.from(list.querySelectorAll('[data-value]'));
                items.forEach((el, i) => {
                    el.classList.toggle('bg-emerald-50', i === activeIndex);
                    el.classList.toggle('text-emerald-800', i === activeIndex);
                });
                if (items[activeIndex]) items[activeIndex].scrollIntoView({ block: 'nearest' });
            };

            const syncDisplay = () => {
                const match = getOptions().find(o => o.value === select.value);
                input.value = match ? match.label : (select.value || '');
            };

            const chooseValue = (value) => {
                select.value = value;
                syncDisplay();
                list.classList.add('hidden');
                select.dispatchEvent(new Event('change'));
            };

            input.addEventListener('focus', () => {
                render(filterOptions(input.value));
                list.classList.remove('hidden');
            });

            input.addEventListener('input', () => {
                render(filterOptions(input.value));
                list.classList.remove('hidden');
            });

            input.addEventListener('keydown', (e) => {
                if (list.classList.contains('hidden') && (e.key === 'ArrowDown' || e.key === 'Enter')) {
                    render(filterOptions(input.value));
                    list.classList.remove('hidden');
                    return;
                }
                const items = Array.from(list.querySelectorAll('[data-value]'));
                if (!items.length) return;

                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    activeIndex = Math.min(activeIndex + 1, items.length - 1);
                    highlight();
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    activeIndex = Math.max(activeIndex - 1, 0);
                    highlight();
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    const target = items[activeIndex] || items[0];
                    if (target) chooseValue(target.dataset.value);
                } else if (e.key === 'Escape') {
                    list.classList.add('hidden');
                }
            });

            document.addEventListener('click', (e) => {
                if (!rowEl.contains(e.target)) {
                    list.classList.add('hidden');
                    // ถ้าพิมพ์ค้างไว้แต่ไม่ได้เลือกรายการ ให้คืนค่าข้อความตามค่าที่เลือกจริง
                    syncDisplay();
                }
            });

            syncDisplay();
        }

        // ฟังก์ชันคำนวณสรุปผลทั้งหมดใน Modal
        function calculateModalTotals() {
            let totalItems = 0; // จำนวนรายการทั้งหมด
            let totalQty = 0;   // จำนวนงานรวมทั้งหมด
            let totalScore = 0; // คะแนนรวมทั้งหมด (จำนวนงาน x คะแนน)

            // 1. คำนวณจากรายการงานตามแผนก (deptTaskItemsContainer)
            const deptRows = document.querySelectorAll('#deptTaskItemsContainer > div');
            deptRows.forEach(row => {
                const select = row.querySelector('.dept-task-select');
                const qtyInput = row.querySelector('.dept-task-qty');

                if (select && select.value) {
                    totalItems += 1;

                    const qty = parseFloat(qtyInput ? qtyInput.value : 0) || 0;
                    totalQty += qty;
                    const selectedOption = select.options[select.selectedIndex];
                    const scorePerItem = parseFloat(selectedOption.getAttribute('data-score') || 0);

                    // คำนวณ: จำนวนงาน * คะแนน
                    totalScore += (qty * scorePerItem);
                }
            });

            // 2. คำนวณจากรายการงานทั่วไป (taskItemsContainer) 
            const taskRows = document.querySelectorAll('#taskItemsContainer > div');
            taskRows.forEach(row => {
                const select = row.querySelector('.task-select, select');
                const qtyInput = row.querySelector('.task-qty, input[type="number"]');

                if (select && select.value) {
                    totalItems += 1;

                    const qty = parseFloat(qtyInput ? qtyInput.value : 0) || 0;
                    totalQty += qty;

                    const selectedOption = select.options[select.selectedIndex];
                    const scorePerItem = parseFloat(selectedOption.getAttribute('data-score') || 0);

                    totalScore += (qty * scorePerItem);
                }
            });

            // 3. แสดงผลไปยัง Elements สรุปผลด้านล่าง
            const totalItemsEl = document.getElementById('modalTotalItems');
            const totalQtyEl = document.getElementById('modalTotalQty');
            const totalScoreEl = document.getElementById('modalTotalScore');

            if (totalItemsEl) totalItemsEl.textContent = totalItems;
            if (totalQtyEl) totalQtyEl.textContent = totalQty;
            if (totalScoreEl) totalScoreEl.textContent = totalScore.toLocaleString();
        }



        async function editTask(id) {
            const task = globalTasks.find(t => Number(t.id) === Number(id));
            if (!task) return;

            const modalTitle = document.getElementById('modalTitle');
            const formRowId = document.getElementById('formRowId');
            const taskRecorder = document.getElementById('taskRecorder');
            const taskNote = document.getElementById('taskNote');
            const deptSelect = document.getElementById('departmentSelect');
            const wrapper = document.getElementById('deptTaskWrapper');
            const taskModal = document.getElementById('taskModal');

            if (modalTitle) modalTitle.innerHTML = `<i class="fas fa-edit mr-2 text-emerald-300"></i> แก้ไขงาน`;
            if (formRowId) formRowId.value = task.id;

            // ตั้งค่าวันที่
            const picker = initDatePicker();
            if (task.date && picker) {
                const parts = task.date.includes('-') ? task.date.split('-') : task.date.split('/');
                let formattedDate = parts.length === 3 ? (parts[0].length === 4 ? `${parts[0]}-${parts[1]}-${parts[2]}` : `${parts[2]}-${parts[1]}-${parts[0]}`) : task.date;
                picker.setDate(formattedDate, true);
            }

            if (taskRecorder) taskRecorder.value = task.recorder;
            if (taskNote) taskNote.value = task.note || '';

            // เคลียร์ค่าช่องรายการเดิมก่อน
            const container = document.getElementById('deptTaskItemsContainer');
            if (container) container.innerHTML = '';
            const generalContainer = document.getElementById('taskItemsContainer');
            if (generalContainer) generalContainer.innerHTML = '';

            let parsedItems = [];
            try {
                if (task.task_items) {
                    parsedItems = typeof task.task_items === 'string' ? JSON.parse(task.task_items) : task.task_items;
                }
            } catch (e) {
                parsedItems = [];
            }

            if (parsedItems && parsedItems.length > 0) {
                let foundDept = '';
                const departments = ['finance', 'loan', 'debt_collection', 'accounting', 'it', 'administrative', 'hr', 'community'];
                const firstJobName = parsedItems[0].jobType;

                for (const dept of departments) {
                    try {
                        const res = await fetch(`db.php?action=get_dept_tasks&dept=${dept}`);
                        const result = await res.json();
                        if (result.success && result.data) {
                            const match = result.data.find(d => d.task_name === firstJobName);
                            if (match) {
                                foundDept = dept;
                                currentDeptTasks = result.data;
                                break;
                            }
                        }
                    } catch (e) {
                        console.error(e);
                    }
                }

                if (foundDept && deptSelect) {
                    deptSelect.value = foundDept;
                    if (wrapper) wrapper.classList.remove('hidden');

                    parsedItems.forEach(item => {
                        addDeptTaskRow(item.jobType, item.quantity);
                    });
                } else {
                    if (deptSelect) deptSelect.value = '';
                    if (wrapper) wrapper.classList.add('hidden');

                    parsedItems.forEach(item => {
                        addTaskRow(item.jobType, item.quantity);
                    });
                }
            } else if (task.jobType) {
                const jobs = task.jobType.split(',').map(j => j.trim());
                let foundDept = '';
                const departments = ['finance', 'loan', 'debt_collection', 'accounting', 'it', 'administrative', 'hr', 'community'];

                for (const dept of departments) {
                    try {
                        const res = await fetch(`db.php?action=get_dept_tasks&dept=${dept}`);
                        const result = await res.json();
                        if (result.success && result.data) {
                            const match = result.data.find(d => jobs.includes(d.task_name));
                            if (match) {
                                foundDept = dept;
                                currentDeptTasks = result.data;
                                break;
                            }
                        }
                    } catch (e) {
                        console.error(e);
                    }
                }

                const totalQty = parseFloat(task.quantity) || 1;
                const qtyPerItem = Math.floor(totalQty / jobs.length);
                let remainder = totalQty % jobs.length;

                if (foundDept && deptSelect) {
                    deptSelect.value = foundDept;
                    if (wrapper) wrapper.classList.remove('hidden');

                    jobs.forEach((jobText, index) => {
                        let assignedQty = qtyPerItem + (index === 0 ? remainder : 0);
                        if (assignedQty <= 0) assignedQty = 1;
                        addDeptTaskRow(jobText, assignedQty);
                    });
                } else {
                    if (deptSelect) deptSelect.value = '';
                    if (wrapper) wrapper.classList.add('hidden');

                    jobs.forEach((jobText, index) => {
                        let assignedQty = qtyPerItem + (index === 0 ? remainder : 0);
                        if (assignedQty <= 0) assignedQty = 1;
                        addTaskRow(jobText, assignedQty);
                    });
                }
            } else {
                if (deptSelect) deptSelect.value = '';
                if (wrapper) wrapper.classList.add('hidden');
                addTaskRow('', task.quantity || 1);
            }

            if (taskModal) taskModal.classList.remove('hidden');

            setTimeout(() => {
                calculateModalTotals();
            }, 50);
        }

        function renderMonthlySummary() {
            const tbody = document.getElementById('summaryTableBody');
            if (!tbody) return;

            const summaryEmp = document.getElementById('summaryFilterEmployee')?.value || 'ALL';
            const summaryMonth = document.getElementById('summaryFilterMonth')?.value || '';

            // กรองข้อมูลงาน
            const filtered = globalTasks.filter(t => {
                if (!t.date) return false;

                let taskMonth = '';
                const parts = t.date.includes('-') ? t.date.split('-') : t.date.split('/');
                if (parts.length === 3) {
                    taskMonth = parts[0].length === 4 ? `${parts[0]}-${parts[1]}` : `${parts[2]}-${parts[1]}`;
                }

                const matchEmp = (summaryEmp === 'ALL') || (t.recorder === summaryEmp);
                const matchMonth = (!summaryMonth) || (taskMonth === summaryMonth);

                return matchEmp && matchMonth;
            });

            let totalTasks = filtered.length;
            let totalQty = filtered.reduce((sum, t) => sum + (parseFloat(t.quantity) || 0), 0);
            let totalScore = filtered.reduce((sum, t) => sum + (parseFloat(t.score) || 0), 0);

            const tasksEl = document.getElementById('summaryTotalTasks');
            const qtyEl = document.getElementById('summaryTotalQty');
            const scoreEl = document.getElementById('summaryTotalScore');

            if (tasksEl) tasksEl.innerText = totalTasks.toLocaleString('th-TH');
            if (qtyEl) qtyEl.innerText = totalQty.toLocaleString('th-TH');
            if (scoreEl) scoreEl.innerText = totalScore.toLocaleString('th-TH');

            const grouped = {};
            filtered.forEach(t => {
                let month = 'ไม่ระบุ';
                if (t.date) {
                    const parts = t.date.includes('-') ? t.date.split('-') : t.date.split('/');
                    if (parts.length === 3) {
                        month = parts[0].length === 4 ? `${parts[1]}/${parts[0]}` : `${parts[1]}/${parts[2]}`;
                    }
                }

                const emp = t.recorder || 'ไม่ระบุ';
                const key = `${month}_${emp}`;

                if (!grouped[key]) {
                    grouped[key] = {
                        month: month,
                        employee: emp,
                        taskCount: 0,
                        totalQty: 0,
                        totalScore: 0
                    };
                }
                grouped[key].taskCount += 1;
                grouped[key].totalQty += (parseFloat(t.quantity) || 0);
                grouped[key].totalScore += (parseFloat(t.score) || 0);
            });

            const summaryList = Object.values(grouped).sort((a, b) => b.month.localeCompare(a.month));

            if (summaryList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-10 text-slate-400 font-light">ไม่พบข้อมูลสรุปตามเงื่อนไขที่เลือก</td></tr>`;
                return;
            }

            tbody.innerHTML = summaryList.map(s => `
        <tr class="hover:bg-slate-50 transition-colors">
            <td class="px-4 py-3.5 font-medium text-slate-700">${s.month}</td>
            <td class="px-4 py-3.5 font-semibold text-slate-800">${s.employee}</td>
            <td class="px-4 py-3.5 text-center text-slate-700">${s.taskCount.toLocaleString('th-TH')}</td>
            <td class="px-4 py-3.5 text-center text-slate-700">${s.totalQty.toLocaleString('th-TH')}</td>
            <td class="px-4 py-3.5 text-center font-bold text-emerald-600">${s.totalScore.toLocaleString('th-TH')}</td>
        </tr>
    `).join('');
        }

        function resetSummaryFilters() {
            const empEl = document.getElementById('summaryFilterEmployee');
            if (empEl) empEl.value = 'ALL';

            if (summaryMonthPickerInstance) {
                summaryMonthPickerInstance.clear();
            } else {
                const monthEl = document.getElementById('summaryFilterMonth');
                if (monthEl) monthEl.value = '';
            }
            renderMonthlySummary();
            clearSummaryMonthFilter();
        }


        function clearSummaryMonthFilter(e) {
            if (e) e.stopPropagation();

            if (summaryMonthPickerInstance) {
                summaryMonthPickerInstance.clear();
            } else {
                const inputEl = document.getElementById('summaryFilterMonth');
                if (inputEl) inputEl.value = '';
            }
            renderMonthlySummary();
        }


        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            if (!toast || !toastMsg || !toastIcon) return;

            toastMsg.innerText = msg;

            if (type === 'error') {
                toastIcon.className = 'fas fa-exclamation-circle text-rose-400 text-lg';
            } else if (type === 'success') {
                toastIcon.className = 'fas fa-check-circle text-emerald-400 text-lg';
            } else {
                toastIcon.className = 'fas fa-info-circle text-sky-400 text-lg';
            }

            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

    </script>
</body>

</html>

<!-- TAB 1: TASK LIST -->
<div id="tabTasks" class="space-y-6 hidden">
    <div class="bg-white p-4 sm:p-5 rounded-2xl shadow-sm border border-emerald-100 space-y-3 text-lg sm:text-xl">
        <div id="filterGridContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-3 items-end">
            <!-- ช่องเลือกผู้บันทึก (สำหรับ Admin) -->
            <div id="filterEmployeeCard">
                <label class="block text-xs sm:text-sm font-semibold text-slate-600 mb-1">
                    <i class="fas fa-user text-emerald-600 mr-1"></i> ผู้บันทึก
                </label>
                <select id="filterEmployee" onchange="filterAndRenderTasks()"
                    class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-xs sm:text-sm rounded-xl p-2.5 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    <option value="ALL">-- แสดงทั้งหมด --</option>
                </select>
            </div>

            <!-- ช่องเลือกประเภทงาน -->
            <div>
                <label class="block text-xs sm:text-sm font-semibold text-slate-600 mb-1">
                    <i class="fas fa-briefcase text-emerald-600 mr-1"></i> ประเภทงาน
                </label>
                <select id="filterJobType" onchange="filterAndRenderTasks()"
                    class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-xs sm:text-sm rounded-xl p-2.5 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    <option value="ALL">-- ทุกประเภทงาน --</option>
                </select>
            </div>

            <!-- ช่องค้นหา -->
            <div>
                <label class="block text-xs sm:text-sm font-semibold text-slate-600 mb-1">
                    <i class="fas fa-search text-emerald-600 mr-1"></i> ค้นหา
                </label>
                <input type="text" id="searchInput" onkeyup="filterAndRenderTasks()" placeholder="ค้นหา..."
                    class="w-full bg-slate-50 border border-slate-200 text-slate-700 text-xs sm:text-sm rounded-xl p-2.5 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>

            <!-- ปุ่มบันทึกงานใหม่ -->
            <div class="flex items-end justify-start lg:justify-end">
                <button onclick="openTaskModal()"
                    class="bg-emerald-500 hover:bg-emerald-600 text-white font-semibold px-4 py-2.5 rounded-xl text-xs sm:text-sm transition-all shadow-md hover:shadow-lg flex items-center space-x-2 transform active:scale-95 whitespace-nowrap">
                    <i class="fas fa-plus-circle"></i>
                    <span>บันทึกงานใหม่</span>
                </button>
            </div>

        </div>
    </div>
</div>

<!-- Table View Container -->
<div id="tableViewContainer" class="bg-white rounded-2xl shadow-sm border border-emerald-100 overflow-hidden">
    <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr
                    class="bg-emerald-50/80 text-emerald-800 uppercase font-bold tracking-wider border-b border-emerald-100 text-xs sm:text-sm">
                    <th class="px-4 py-3.5">วันที่</th>
                    <th class="px-4 py-3.5">ผู้บันทึก</th>
                    <th class="px-4 py-3.5">ประเภทงาน</th>
                    <th class="px-4 py-3.5 text-center">จำนวน</th>
                    <th class="px-4 py-3.5 text-center">ผลคะแนน</th>
                    <th class="px-4 py-3.5">หมายเหตุ</th>
                    <th class="px-4 py-3.5 text-center">แก้ไข</th>
                </tr>
            </thead>
            <tbody id="taskTableBody" class="divide-y divide-slate-100 text-xs sm:text-sm"></tbody>
        </table>
    </div>
</div>

<!-- Card View Container -->
<div id="cardViewContainer" class="hidden grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
</div>
